server:
  port: 8080
spring:
  profiles:
    # 本地开发默认加载 application-local.yml（已被 .gitignore 排除），生产环境用 SPRING_PROFILES_ACTIVE 覆盖
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/case_assistant_db2?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization:  true
  sql:
    init:
      mode: never

# 日志配置 ---
logging:
  level:
    # 将Hibernate SQL日志级别设为 DEBUG，以打印出准备执行的SQL语句
    org.hibernate.SQL: DEBUG
    # (可选但推荐) 将参数绑定日志级别设为 TRACE，以看到SQL语句中的'?'被替换后的值
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.web.client.RestTemplate: TRACE
    org.apache.http: TRACE

# Dify API 配置
dify:
  api:
    base-url: ${DIFY_BASE_URL:http://localhost/v1}
    chat-key: ${DIFY_CHAT_KEY:}
    work-flow-key: ${DIFY_WORKFLOW_KEY:}
    text-to-sql-key: ${DIFY_TEXT_TO_SQL_KEY:}
    # 文件上传后等待多久再触发工作流(毫秒)，默认3000，视Dify处理速度调整
    workflow-trigger-delay-ms: 3000

file:
  storage-path: ${FILE_STORAGE_PATH:D:/case_files}

lcba-api:
  base-url: ${LCBA_BASE_URL:}
jodconverter:
  local:
    # 临时禁用：未安装 LibreOffice 时，启动会因 OfficeManager 校验失败而崩溃。
    # 禁用后 .doc 文件会被跳过，.pdf/.docx 不受影响，主链路（Agent 评查）可正常联调。
    # 装好 LibreOffice 后改回 true 即可恢复 .doc→.pdf 转换。
    enabled: false
    office-home: C:/Program Files/LibreOffice

# Python Agent 服务配置
agent:
  service:
    url: http://localhost:8000
    # Agent 调 RAG + 多步推理 + 格式兜底重试，真实案件耗时可达 2-3 分钟，
    # 原 120 秒不够会超时断开导致 case_issues 不写库，调到 300 秒
    timeout-seconds: 300